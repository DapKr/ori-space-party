<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b2e">
<title>שולחים לחלל! 🚀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070824;
    --card: rgba(22, 26, 72, .82);
    --ink: #f2f4ff;
    --muted: #b4bbe8;
    --accent: #ffcc33;
    --accent-ink: #1a1340;
    --line: #3a4196;
    --danger: #ff6b81;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Rubik', system-ui, sans-serif; color: var(--ink); background: var(--bg);
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 20%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 65%, #cfe3ff 50%, transparent 51%),
      radial-gradient(1px 1px at 35% 80%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 50%, #ffe7b3 50%, transparent 51%),
      radial-gradient(1px 1px at 10% 60%, #fff 50%, transparent 51%),
      radial-gradient(60% 40% at 15% 10%, rgba(120, 60, 200, .35), transparent),
      radial-gradient(60% 40% at 90% 90%, rgba(220, 60, 140, .25), transparent);
    background-size: 220px 220px, 260px 260px, 300px 300px, 240px 240px, 200px 200px, 280px 280px, 100% 100%, 100% 100%;
    background-attachment: fixed;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  main { max-width: 460px; margin: 0 auto; }
  header { text-align: center; margin: 8px 0 20px; }
  .rocket { font-size: 56px; display: inline-block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px) rotate(-6deg); } }
  h1 { margin: 6px 0 8px; font-size: 30px; font-weight: 800; line-height: 1.2;
    background: linear-gradient(90deg, #ffd166, #ff7aa8, #8ec5ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  .pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: 100%;
    min-height: 220px; border: 2px dashed #5d66d0; border-radius: 18px; background: rgba(30, 35, 95, .6);
    color: var(--ink); font: inherit; cursor: pointer; text-align: center; padding: 16px; }
  .pick .big { font-size: 52px; }
  .pick b { font-size: 21px; }
  .pick small { color: var(--muted); font-size: 15px; }
  .preview { position: relative; display: none; }
  .preview img { display: block; width: 100%; max-height: 52vh; object-fit: contain; border-radius: 16px; background: #000; }
  .preview button { position: absolute; top: 10px; left: 10px; font: inherit; font-size: 15px; border: 0; border-radius: 999px;
    padding: 8px 14px; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; }
  .has-photo .preview { display: block; }
  .has-photo .pick { display: none; }

  label.name { display: block; margin-top: 16px; font-size: 16px; color: var(--muted); }
  label.name input { display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 19px; color: var(--ink);
    background: rgba(15, 18, 55, .9); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; }
  label.name input:focus { outline: 2px solid var(--accent); border-color: transparent; }

  .send { display: block; width: 100%; margin-top: 18px; font: inherit; font-size: 22px; font-weight: 800;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 28px rgba(255, 204, 51, .35); cursor: pointer; }
  .send:disabled { opacity: .45; box-shadow: none; cursor: default; }

  .status { margin-top: 14px; text-align: center; font-size: 16px; min-height: 1.4em; color: var(--muted); }
  .status.err { color: var(--danger); }
  .status.warn { color: #ffd98a; line-height: 1.5; }
  .anyway { display: none; margin: 10px auto 0; font: inherit; font-size: 15px; color: var(--muted); background: none;
    border: 0; text-decoration: underline; cursor: pointer; padding: 6px 10px; }
  .no-rocket .anyway { display: block; }

  .done { display: none; text-align: center; padding: 26px 10px; }
  .done .big { font-size: 72px; }
  .done h2 { margin: 8px 0; font-size: 28px; }
  .done p { color: var(--muted); font-size: 18px; margin: 0 0 22px; }
  .sent .done { display: block; }
  .sent .form { display: none; }

</style>
</head>
<body>
<main>
  <header>
    <div class="rocket">🚀</div>
    <h1>שולחים את הילדים לחלל!</h1>
    <p>צלמו את הילד או הילדה בתוך החללית ושלחו.<br>תוך כמה שניות הם יופיעו מרחפים על המסך הגדול ✨</p>
  </header>

  <section class="card" id="card">
    <div class="form">
      <input type="file" id="file" accept="image/*" hidden>
      <button class="pick" id="pick" type="button">
        <span class="big">📸</span>
        <b>צלמו או בחרו תמונה</b>
        <small>מהמצלמה או מהגלריה</small>
      </button>
      <div class="preview">
        <img id="previewImg" alt="התמונה שנבחרה">
        <button type="button" id="change">החלפת תמונה</button>
      </div>

      <label class="name">שם הילד/ה (לא חובה)
        <input type="text" id="name" maxlength="30" autocomplete="off" placeholder="למשל: נועה">
      </label>

      <button class="send" id="send" type="button" disabled>🚀 שיגור לחלל!</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <button class="anyway" id="anyway" type="button">לשלוח בכל זאת</button>
    </div>

    <div class="done">
      <div class="big">🎉</div>
      <h2>השיגור הצליח!</h2>
      <p>הסתכלו על המסך הגדול 👀</p>
      <button class="send" id="again" type="button">📸 שליחת תמונה נוספת</button>
    </div>
  </section>
</main>

<script type="module">
import { addPhoto } from './js/store.js';
import { cutRocket } from './js/rocket.js';

const $ = (id) => document.getElementById(id);
const card = $('card'), file = $('file'), send = $('send'), status = $('status');
let chosen = null, previewUrl = null, ready = null, retake = false, checkId = 0;

function setStatus(text, kind = '') { // kind: '', 'err' or 'warn'
  status.textContent = text;
  status.classList.toggle('err', kind === 'err' || kind === true);
  status.classList.toggle('warn', kind === 'warn');
}

// Shrink big phone photos before sending (faster upload, fixes rotation). Falls back to the original file.
async function shrink(f, max = 1600) {
  try {
    const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close?.();
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9));
    return blob || f;
  } catch {
    return f;
  }
}

function choose(f) {
  if (!f) return;
  if (!f.type.startsWith('image/') && !/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name)) {
    setStatus('זה לא נראה כמו תמונה, נסו קובץ אחר', true);
    return;
  }
  chosen = f;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(f);
  $('previewImg').src = previewUrl;
  card.classList.add('has-photo');
  checkForRocket(f);
}

// Make sure the rocket is in the photo before sending. If it isn't found, suggest taking it again,
// but always let the guest send anyway (the check can miss a rocket that is there).
async function checkForRocket(f) {
  const id = ++checkId;
  retake = false;
  card.classList.remove('no-rocket');
  send.textContent = '🚀 שיגור לחלל!';
  send.disabled = true;
  setStatus('בודקים שהחללית בתמונה… 🔭');
  ready = shrink(f);
  let found = true;
  try { found = !!(await cutRocket(await ready, { detectOnly: true })); } catch (e) { console.warn(e); } // can't check: let it through
  if (id !== checkId) return; // another photo was picked meanwhile
  if (found) {
    setStatus('✅ מצאנו את החללית!');
  } else {
    retake = true;
    card.classList.add('no-rocket');
    send.textContent = '📸 לצלם שוב';
    setStatus('🤔 לא מצאנו את החללית בתמונה. נסו לצלם שוב מקדימה, כשכל החללית בתוך התמונה', 'warn');
  }
  send.disabled = false;
}

$('pick').onclick = () => file.click();
$('change').onclick = () => file.click();
file.onchange = () => { choose(file.files[0]); file.value = ''; };

async function sendPhoto() {
  if (!chosen) return;
  send.disabled = true;
  card.classList.remove('no-rocket');
  setStatus('שולחים לחלל… 🛸');
  try {
    const blob = await (ready || shrink(chosen));
    await addPhoto({ name: $('name').value, blob });
    card.classList.add('sent');
    setStatus('');
  } catch (e) {
    console.error(e);
    setStatus('אופס, משהו השתבש. בדקו שיש אינטרנט ונסו שוב', 'err');
    send.disabled = false;
  }
}
send.onclick = () => (retake ? file.click() : sendPhoto());
$('anyway').onclick = () => { retake = false; send.textContent = '🚀 שיגור לחלל!'; sendPhoto(); };

$('again').onclick = () => {
  chosen = null; ready = null; retake = false;
  $('name').value = '';
  card.classList.remove('sent', 'has-photo', 'no-rocket');
  send.textContent = '🚀 שיגור לחלל!';
  send.disabled = true;
  setStatus('');
};
</script>
</body>
</html>
