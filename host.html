<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Party host</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #e3e5ea;
    --line-strong: #cfd3db;
    --ink: #1c1f26;
    --muted: #6b7280;
    --accent: #3b5bdb;
    --accent-soft: #edf1ff;
    --danger: #c92a2a;
    --ok: #2b8a3e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  button, input { font: inherit; color: inherit; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .top .actions { display: flex; align-items: center; gap: 8px; }

  /* layout */
  .layout { max-width: 1120px; margin: 0 auto; padding: 24px; display: grid; gap: 20px;
    grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 16px; } .top { padding: 12px 16px; } }
  .side { display: grid; gap: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .panel h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .panel-head h2 { margin: 0; }
  .panel-head .tools { display: flex; gap: 8px; }
  .count { display: inline-block; min-width: 22px; margin-left: 6px; padding: 0 7px; border-radius: 999px;
    background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 500; text-align: center; }
  .note { margin: 12px 0 0; color: var(--muted); font-size: 13px; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px;
    border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); cursor: pointer;
    text-decoration: none; color: var(--ink); font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--bg); }
  .btn:focus-visible, .name-input:focus-visible, .field:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.quiet { border-color: transparent; background: none; color: var(--muted); }
  .btn.quiet:hover { color: var(--ink); background: var(--bg); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: #fff5f5; border-color: #f3c4c4; }
  .btn.sm { min-height: 30px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* form fields */
  .label { display: block; margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  .label:first-of-type { margin-top: 0; }
  .field { display: block; width: 100%; min-height: 38px; padding: 7px 10px; border: 1px solid var(--line-strong);
    border-radius: 8px; background: var(--panel); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; cursor: pointer; }
  .switch input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 38px; height: 22px; margin: 0;
    border-radius: 999px; background: var(--line-strong); cursor: pointer; transition: background .15s; }
  .switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(16px); }
  .switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* photo list */
  .photo-list { list-style: none; margin: 0; padding: 0; }
  .photo { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 14px;
    padding: 10px 0; border-top: 1px solid var(--line); }
  .photo:first-child { border-top: 0; padding-top: 0; }
  .photo img { width: 64px; height: 64px; object-fit: contain; border-radius: 8px; background: var(--bg); display: block; }
  .photo .info { min-width: 0; }
  .name-input { display: block; width: 100%; max-width: 320px; padding: 5px 8px; margin-left: -8px; border: 1px solid transparent;
    border-radius: 6px; background: none; font-weight: 500; text-align: left; }
  .name-input:hover { border-color: var(--line-strong); }
  .name-input:focus { border-color: var(--accent); background: var(--panel); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .name-input::placeholder { color: #a0a6b1; font-weight: 400; }
  .meta { margin-top: 2px; font-size: 13px; color: var(--muted); }
  .meta .saved { color: var(--ok); }
  .photo .row-actions { display: flex; gap: 6px; }
  @media (max-width: 520px) {
    .photo { grid-template-columns: 56px minmax(0, 1fr); }
    .photo img { width: 56px; height: 56px; }
    .photo .row-actions { grid-column: 2; }
  }
  .empty { padding: 28px 0; text-align: center; color: var(--muted); }

  /* add photos */
  .drop { display: grid; place-items: center; gap: 2px; margin-top: 12px; padding: 18px; text-align: center; cursor: pointer;
    border: 1px dashed var(--line-strong); border-radius: 8px; background: var(--bg); }
  .drop:hover { border-color: var(--accent); }
  .drop small { color: var(--muted); }

  /* guest link + QR */
  .qr { display: flex; gap: 14px; align-items: center; }
  #qrPreview { flex: none; width: 112px; height: 112px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  #qrPreview svg { display: block; width: 100%; height: 100%; }
  .qr .btns { display: grid; gap: 6px; flex: 1; }
  .linkrow { display: flex; gap: 6px; margin-top: 12px; }
  .linkrow .field { font-size: 13px; color: var(--muted); }

  /* toast */
  #msg { position: fixed; left: 50%; bottom: 20px; z-index: 20; transform: translate(-50%, 8px); padding: 9px 16px;
    border-radius: 8px; background: var(--ink); color: #fff; font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; }
  #msg.show { opacity: 1; transform: translate(-50%, 0); }

  /* login */
  #lock { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: var(--bg); }
  #lock[hidden] { display: none; }
  #lock .panel { width: min(360px, 100%); padding: 24px; }
  #lock h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  #lock p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  #loginBtn { width: 100%; margin-top: 14px; }
  #loginErr { min-height: 1.4em; margin: 10px 0 0; color: var(--danger); font-size: 14px; }
</style>
</head>
<body>
<header class="top">
  <h1>Party host</h1>
  <div class="actions">
    <a class="btn primary" id="openShow" href="index.html" target="_blank" rel="noopener">Open big screen ↗</a>
    <button class="btn quiet" id="logoutBtn" type="button">Log out</button>
  </div>
</header>

<main class="layout">
  <section class="panel">
    <div class="panel-head">
      <h2>Photos<span class="count" id="count">0</span></h2>
      <div class="tools">
        <button class="btn" id="spotBtn" type="button">Spotlight a random photo</button>
        <button class="btn danger" id="clearBtn" type="button">Clear all</button>
      </div>
    </div>
    <ul class="photo-list" id="list"></ul>
  </section>

  <aside class="side">
    <section class="panel">
      <h2>Big screen</h2>
      <label class="label" for="titleInput">Title</label>
      <input class="field" type="text" id="titleInput" dir="auto" autocomplete="off">
      <label class="switch"><span>Spotlight a random photo every ~20 seconds</span><input type="checkbox" id="spotToggle"></label>
      <label class="switch"><span>Cut out new photos automatically</span><input type="checkbox" id="cutToggle"></label>
      <p class="note">On the projector laptop, open the big screen and press F (or double-click it) for fullscreen.</p>
    </section>

    <section class="panel">
      <h2>Add photos</h2>
      <label class="label" for="nameInput">Name (optional)</label>
      <input class="field" type="text" id="nameInput" dir="auto" placeholder="e.g. נועה" autocomplete="off">
      <label class="drop">
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <span>Choose photos</span>
        <small>They go straight to the big screen</small>
      </label>
    </section>

    <section class="panel">
      <h2>Guest upload link</h2>
      <div class="qr">
        <div id="qrPreview"></div>
        <div class="btns">
          <button class="btn sm" id="dlPng" type="button">Download QR (PNG)</button>
          <button class="btn sm" id="dlSvg" type="button">Download QR (SVG)</button>
          <a class="btn sm" id="openUpload" target="_blank" rel="noopener">Open upload page ↗</a>
        </div>
      </div>
      <div class="linkrow">
        <input class="field" type="text" id="uploadLink" readonly>
        <button class="btn" id="copyLink" type="button">Copy</button>
      </div>
      <p class="note" id="qrNote"></p>
    </section>
  </aside>
</main>

<div id="msg" role="status" aria-live="polite"></div>
<div id="lock" hidden>
  <form class="panel" id="loginForm">
    <h1>Party host</h1>
    <p>Enter the host password to continue.</p>
    <label class="label" for="pwInput">Password</label>
    <input class="field" type="password" id="pwInput" autocomplete="current-password" required>
    <button class="btn primary" id="loginBtn" type="submit">Log in</button>
    <p id="loginErr" role="alert"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="js/host.js"></script>
</body>
</html>
