<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>החלל של אורי 🚀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04051a;
    --ink: #eef1ff;
    --muted: #a9b0e0;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: 'Fredoka', 'Rubik', 'Segoe UI', system-ui, sans-serif; }
  body.idle { cursor: none; }

  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #title { position: fixed; top: 3vh; left: 0; right: 0; margin: 0; text-align: center; z-index: 1;
    font-size: clamp(28px, 7.5vh, 96px); font-weight: 700; pointer-events: none;
    background: linear-gradient(90deg, #ffd166, #ff7aa8, #8ec5ff, #b8f2a1, #ffd166); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 10s linear infinite; filter: drop-shadow(0 0 24px rgba(255, 190, 140, .35)); }
  @keyframes shimmer { to { background-position: 300% 0; } }

  #stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .kid { position: absolute; left: 0; top: 0; will-change: transform; user-select: none; -webkit-user-drag: none;
    filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .45)); }

  #banner { position: fixed; left: 50%; bottom: 5vh; z-index: 6; pointer-events: none; white-space: nowrap;
    transform: translate(-50%, 40px) scale(.9); opacity: 0; transition: opacity .5s, transform .5s cubic-bezier(.3,1.6,.5,1);
    font-size: clamp(22px, 6vh, 72px); font-weight: 700; padding: .25em .9em; border-radius: 999px;
    background: rgba(10, 12, 45, .65); border: 3px solid rgba(255, 204, 51, .8); color: #fff;
    box-shadow: 0 0 40px rgba(255, 204, 51, .35); }
  #banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  #empty { position: fixed; inset: 0; z-index: 3; display: grid; place-content: center; text-align: center;
    pointer-events: none; transition: opacity .6s; }
  #empty .rocket { font-size: 16vh; animation: hover 3s ease-in-out infinite; }
  #empty p { margin: .4em 0 0; font-size: clamp(18px, 4.5vh, 50px); color: var(--muted); }
  #empty.hide { opacity: 0; }
  @keyframes hover { 50% { transform: translateY(-3vh) rotate(6deg); } }

  #toast { position: fixed; right: 2.5vh; bottom: 2.5vh; z-index: 20; max-width: min(520px, calc(100vw - 48px));
    background: rgba(17, 20, 58, .9); border: 1px solid #343a86; border-radius: 14px; padding: 12px 16px;
    font-size: clamp(15px, 2.2vh, 22px); display: none; }
  #toast.show { display: block; }
  .bar { height: 8px; background: #2a2f6e; border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffcc33, #ff7aa8); transition: width .3s; }

  /* only visible while the mouse moves, so the projector view stays clean */
  #fsHint { position: fixed; left: 2.5vh; top: 2.5vh; z-index: 20; font-size: 15px; color: var(--muted);
    background: rgba(17, 20, 58, .85); border: 1px solid #343a86; border-radius: 10px; padding: 8px 12px;
    cursor: pointer; transition: opacity .4s; }
  body.idle #fsHint, body.fs #fsHint { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<h1 id="title"></h1>
<div id="stage"></div>
<div id="empty"><div class="rocket">🚀</div><p>מחכים לאסטרונאוטים שלנו…</p></div>
<div id="banner"></div>
<div id="toast"><div id="toastText"></div><div class="bar"><i id="toastBar"></i></div></div>
<div id="fsHint" title="Fullscreen">⛶ מסך מלא (F)</div>

<script type="module" src="js/show.js"></script>
</body>
</html>
